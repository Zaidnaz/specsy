<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="specsy commands: lint, rules, explain, footprint, mcp">
  <rect x="0.0" y="0.0" width="1200.0" height="420.0" rx="0" fill="#ffffff"/>
  <text x="60.0" y="62.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#1f2328" font-weight="700">What to call, and when</text>
  <text x="60.0" y="88.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="15" fill="#59636e">specsy --help</text>
  <rect x="60.0" y="104.0" width="1080.0" height="44.0" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="84.0" y="130.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="17" fill="#0969da" font-weight="600">specsy</text>
  <text x="400.0" y="130.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#59636e">You have written or edited a spec and want it checked before implementing.</text>
  <rect x="60.0" y="156.0" width="1080.0" height="44.0" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="84.0" y="182.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="17" fill="#1f2328" font-weight="600">specsy rules</text>
  <text x="400.0" y="182.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#59636e">You are about to write your first spec and want to know the bar.</text>
  <rect x="60.0" y="208.0" width="1080.0" height="44.0" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="84.0" y="234.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="17" fill="#1f2328" font-weight="600">specsy explain &lt;rule&gt;</text>
  <text x="400.0" y="234.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#59636e">A finding is unclear and you want to see what good looks like.</text>
  <rect x="60.0" y="260.0" width="1080.0" height="44.0" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="84.0" y="286.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="17" fill="#1f2328" font-weight="600">specsy footprint</text>
  <text x="400.0" y="286.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#59636e">A change feels large and you want to know what re-reading it costs.</text>
  <rect x="60.0" y="312.0" width="1080.0" height="44.0" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="84.0" y="338.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="17" fill="#1a7f37" font-weight="600">specsy mcp</text>
  <text x="400.0" y="338.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#59636e">You want the agent to lint and fix its own specs, with no human relaying output.</text>
  <text x="60.0" y="404.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" fill="#59636e">Exit codes:  0 = clean · 1 = findings · 2 = specsy could not run</text>
</svg>
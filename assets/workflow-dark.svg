<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="The loop: you describe a feature, the agent writes a spec, lints it with specsy, fixes what it finds, and only then implements">
  <defs>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker>
    <marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/></marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/></marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4493f8"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="1200.0" height="500.0" rx="0" fill="#0d1117"/>
  <rect x="40.0" y="98.0" width="250.0" height="90.0" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
  <text x="68.0" y="124.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#4493f8" font-weight="700" letter-spacing="1.4">STEP 1</text>
  <text x="68.0" y="150.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" fill="#f0f6fc" font-weight="700">You describe</text>
  <text x="68.0" y="172.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" fill="#f0f6fc" font-weight="700">the feature</text>
  <rect x="330.0" y="60.0" width="520.0" height="330.0" rx="10" fill="#161b22" stroke="#4493f8" stroke-width="2.5"/>
  <text x="380.0" y="92.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#4493f8" font-weight="700" letter-spacing="1.4">STEP 2</text>
  <text x="444.0" y="92.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#9198a1">Your agent, on its own</text>
  <rect x="380.0" y="120.0" width="420.0" height="46.0" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
  <text x="590.0" y="149.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#f0f6fc" text-anchor="middle">writes the spec</text>
  <rect x="380.0" y="196.0" width="420.0" height="46.0" rx="8" fill="#0d1117" stroke="#4493f8" stroke-width="2"/>
  <text x="590.0" y="225.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="17" fill="#4493f8" font-weight="600" text-anchor="middle">calls lint_specs</text>
  <rect x="380.0" y="272.0" width="420.0" height="46.0" rx="8" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
  <text x="590.0" y="301.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#d29922" text-anchor="middle">reads the fix, rewrites the spec</text>
  <line x1="590" y1="166" x2="590" y2="190" stroke="#9198a1" stroke-width="2.5" marker-end="url(#ah-m)"/>
  <line x1="590" y1="242" x2="590" y2="266" stroke="#d29922" stroke-width="2.5" marker-end="url(#ah-a)"/>
  <text x="606.0" y="261.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#d29922" font-weight="600">findings</text>
  <path d="M 380 295 L 356 295 Q 348 295 348 287 L 348 227 Q 348 219 356 219 L 374 219" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah-a)"/>
  <text x="380.0" y="356.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#9198a1">16 deterministic rules · no LLM · no API key</text>
  <rect x="930.0" y="174.0" width="230.0" height="90.0" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="958.0" y="200.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#4493f8" font-weight="700" letter-spacing="1.4">STEP 3</text>
  <text x="958.0" y="226.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" fill="#f0f6fc" font-weight="700">It implements</text>
  <text x="958.0" y="248.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" fill="#f0f6fc" font-weight="700">the change</text>
  <line x1="290" y1="143" x2="374" y2="143" stroke="#9198a1" stroke-width="2.5" marker-end="url(#ah-m)"/>
  <line x1="804" y1="219" x2="926" y2="219" stroke="#3fb950" stroke-width="2.5" marker-end="url(#ah-g)"/>
  <text x="890.0" y="206.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" fill="#3fb950" font-weight="600" text-anchor="middle">clean</text>
  <text x="600.0" y="438.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#f0f6fc" text-anchor="middle">The agent calls the rules itself — nobody copies output between windows</text>
  <text x="600.0" y="466.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="15" fill="#4493f8" text-anchor="middle">claude mcp add specsy -- npx -y specsy mcp</text>
</svg>